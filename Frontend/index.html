<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Service Site</title>
    <link rel="icon" type="image/png" href="images/app-logo.png" />
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900" rel="stylesheet">
</head>

<body>

    <header>
        <nav aria-label="Navigation Bar">
            <div class="nav-title">Medical Agent</div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#clinics">Clincs</a></li>
                <li> <a href="#pharmacy">Pharmacy</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
            <button class="mobile-menu" aria-label="Navigation bar menu mobile button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>


    <main>

        <section id="home" class="hero">
            <h1>Your Health, Our Priority</h1>
            <p>Book appointments with top doctors and order medicines online.</p>
            <a href="#clinics" role="button">Book Now</a>
        </section>

        

        <section id="clinics" class="clinics-section">
            <h2>Find a Clinc</h2>
            <div id="clinics-grid" class="clinics-grid"></div>
        </section>


    
        <form id="booking-clinic-modal">
            <button type="button" class="close-modal-btn" data-closeformbtn="closeModal">&times;</button>
            <h2>Book Appointment</h2>
            <div>
                <label for="clinic-name-field">Clinic Name</label>
                <input 
                    type="text" 
                    id="clinic-name-field" 
                    name="clinic-name" 
                    aria-label="Booked Clinic Name"
                    readonly>
            </div>
            <div>
                <label for="patient-name-field">Your Name</label>
                <input 
                    type="text"
                    placeholder="Ahmed " 
                    id="patient-name-field" 
                    name="patient-name" 
                    aria-label="Your name"
                    pattern="[a-zA-z]+" 
                    title="Enter characters only, no numbers allowed"
                    required
                    >
            </div>
            <div>
                <label for="date-field">Date</label>
                <input 
                    type="date"
                    id="date-field" 
                    name="date-field"
                    aria-label="Appointment Date" 
                    required
                    >
            </div>
            <div>
                <label for="time-field">Time</label>
                <input 
                    type="time"
                    id="time-field" 
                    name="time-field" 
                    aria-label="Appointment time" 
                    required
                    >
            </div>
            <button type="submit" class="submit-btn">Confirm Booking</button >            
        </form>

        <div id="booking-msg" class="booking-done-msg">
            <button class="close-modal-btn" data-closemsgbtn="closeMsg">&times;</button>
        </div>

       <section id="pharmacy" class="pharmacy-section">
            <h2>Your Online Pharmacy</h2>
            <div id="pharmacy-grid" class="pharmacy-grid"></div>
        </section>
        
    </main>

    <script src="index.js" type="module"></script>
</body>

</html>
